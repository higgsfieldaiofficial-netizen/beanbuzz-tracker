<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bean Buzz — Business Management</title>
<style>
:root{--cream:#F7F1E2;--paper:#FFFDF5;--card:#FFFFFF;--green:#0C3B2E;--green2:#14532D;--green3:#1E6B45;--gold:#C2A059;--gold2:#A8823D;--goldsoft:#EFE3C2;--ink:#243528;--mut:#7C7666;--line:#E7DFC9;--red:#B3402E;--amber:#9A6B00;--shadow:0 6px 22px rgba(12,59,46,.10);--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--cream);color:var(--ink);padding-bottom:98px;font-size:15px}
header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#FBF7EA,#F7F1E2);padding:10px 16px 8px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header img.logo{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#fff}
header .t{font-family:Georgia,"Times New Roman",serif;font-size:19px;letter-spacing:2.5px;color:var(--green);font-weight:700;line-height:1}
header .s{font-size:9.5px;letter-spacing:2.4px;color:var(--gold2);font-weight:700;margin-top:3px}
header .today{margin-left:auto;text-align:right;font-size:11px;color:var(--mut);line-height:1.5}
header .today b{color:var(--green);font-size:12.5px}
main{max-width:560px;margin:0 auto;padding:14px 14px 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:0 0 14px}
.card h3{margin:0 0 10px;font-size:13px;letter-spacing:1.6px;color:var(--green);text-transform:uppercase;font-weight:700}
.card h3::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:8px;vertical-align:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:13px 14px}
.stat .k{font-size:10.5px;letter-spacing:1.4px;color:var(--mut);font-weight:700;text-transform:uppercase}
.stat .v{font-family:Georgia,serif;font-size:23px;color:var(--green);margin-top:4px;font-weight:700}
.stat .n{font-size:11.5px;color:var(--mut);margin-top:2px}
.hero{background:radial-gradient(120% 150% at 85% -20%,#1E6B45 0%,var(--green) 55%);border:none;border-radius:22px;padding:18px;color:#F5EDD6;box-shadow:0 12px 28px rgba(12,59,46,.28);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-38px;top:-38px;width:150px;height:150px;border-radius:50%;border:22px solid rgba(194,160,89,.20)}
.hero .brand{display:flex;align-items:center;gap:11px;position:relative;z-index:1;margin-bottom:13px}
.hero .brand img{width:52px;height:52px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;background:#fff}
.hero .brand .b1{font-family:Georgia,serif;font-size:20px;letter-spacing:2px;font-weight:700;color:#F5EDD6}
.hero .brand .b2{font-size:9px;letter-spacing:2.8px;color:#D9C48C;font-weight:700;margin-top:2px}
.hero .k{color:#D9C48C;position:relative;z-index:1}
.hero .v{font-family:Georgia,serif;font-size:27px;color:#FFF3D0;position:relative;z-index:1}
.hero .n{color:#E8E0C4;position:relative;z-index:1}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;vertical-align:middle}
.p-pend{background:#FBEBC0;color:var(--amber)}.p-conf{background:#DDF0DD;color:#226622}.p-prov{background:#E7E4F5;color:#4A3F8F}.p-exp{background:#F9E8E2;color:var(--red)}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:none}.row .r{text-align:right;white-space:nowrap}
.small{font-size:12px;color:var(--mut)}.tiny{font-size:11px;color:var(--mut)}
button{font:inherit;cursor:pointer}
.btn{background:linear-gradient(180deg,var(--green2),var(--green));color:#F8F0D2;border:none;border-radius:12px;padding:10px 16px;font-weight:700;letter-spacing:.3px;box-shadow:0 6px 14px rgba(12,59,46,.22)}
.btn:active{transform:scale(.985)}
.btn.gold{background:linear-gradient(180deg,#D9B96A,var(--gold2));color:#2E2208}
.btn.ghost{background:#fff;border:1.5px solid var(--green);color:var(--green);box-shadow:none}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:9px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;margin:3px 0 9px;color:var(--ink)}
label{font-size:12.5px;font-weight:600;color:var(--green)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--green);box-shadow:0 -6px 20px rgba(12,59,46,.3);display:flex;z-index:50;padding:7px 6px calc(7px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:none;padding:5px 0 3px;font-size:10.5px;color:#B9AE8C;font-weight:700;letter-spacing:.4px;border-radius:12px}
nav button.on{color:#FBF4DC;background:rgba(255,255,255,.10)}
nav button .ic{display:block;font-size:20px;margin-bottom:2px}
.sheet{position:fixed;inset:0;background:rgba(20,25,15,.45);display:none;z-index:60}
.sheet.open{display:block}
.sheet .box{position:absolute;left:0;right:0;bottom:0;background:var(--cream);border-radius:18px 18px 0 0;padding:16px;max-height:82vh;overflow:auto}
.sheet .box button.m{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin:0 0 9px;font-weight:600;color:var(--green);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}td.r,th.r{text-align:right}
.search{margin-bottom:10px}
#toast{position:fixed;left:16px;right:16px;top:14px;background:var(--green);color:#F8F0D2;padding:12px 14px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:95;display:none;box-shadow:0 10px 24px rgba(12,59,46,.30);text-align:center}
#lock{position:fixed;inset:0;background:radial-gradient(120% 150% at 85% -20%,#1E6B45 0%,var(--green) 55%);color:#F5EDD6;z-index:80;display:none;padding:40px 24px;text-align:center}
a{color:var(--green2)}
</style></head><body>

 h+='<div class="card"><h3>Add New Entry</h3><label>Date</label><input type="date" id="neDate" value="'+new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'})+'"><label>Item / Work name</label><input id="neName" placeholder="e.g. Milk Powder"><label>Amount (₹)</label><input type="number" id="neAmt" inputmode="decimal"><label>Type</label><select id="neType"><option value="pending">Stock Purchase (Pending classification)</option><option value="expense">Business Expense</option></select><label>Quantity / Note (optional)</label><input id="neNote" placeholder="e.g. 1 kg, 300 pcs"><button class="btn" onclick="addEntry()">+ Save Entry</button></div>';
 return h}
function addEntry(){const d=$('#neDate').value,n=$('#neName').value.trim(),a=+$('#neAmt').value;if(!d||!n||!a){msg('Date, name and amount are all required.');return}db.entries.push({id:'E'+Date.now(),date:d,raw:n,amount:a,type:$('#neType').value,qtyNote:$('#neNote').value,payment:'pending'});save();render();msg('Saved — '+n+' '+inr(a)+' list me jud gaya.')}

function vSales(){
 let rows=db.sales.map(s=>'<div class="row"><div><b>'+s.id+'</b> — '+(s.date?dstr(s.date):'<span class="pill p-pend">Date Pending</span>')+'<div class="small">'+((s.cash==null&&s.online==null)?'Cash/Online split Pending — only the total was given, not guessed':('Cash '+inr(s.cash||0)+' · Online '+inr(s.online||0)))+'</div></div><div class="r"><b>'+inr(s.amount!=null?s.amount:(+s.cash||0)+(+s.online||0))+'</b><br><button class="btn sm ghost" onclick="editSale(\''+s.id+'\')">Edit</button></div></div>').join('');
 let closedRows=(db.closedDays||[]).map(d=>'<div class="row"><div>'+dstr(d)+'</div><div class="r"><span class="pill p-exp">Stall Closed</span></div></div>').join('');
 return '<div class="card"><h3>Food Sales — November 2026</h3><div class="small">Owner confirmed (12 Nov): <b>01/11, 02/11, 05/11, 06/11 open</b> — total sale <b>'+inr(salesTotal())+'</b>. <b>03, 04, 07, 08, 09, 10, 11 Nov stall CLOSED</b> — those days are closed, not zero-sale. Days after 12 Nov are still Pending.</div></div><div class="card">'+rows+'</div><div class="card"><h3>Closed Days (1–11 Nov)</h3>'+closedRows+'<div class="small">Open days: 4 · Closed days: 7 · Total days: 11</div></div><div class="card"><h3>Add New Sale</h3><label>Date</label><input type="date" id="nsDate" value="'+new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'})+'"><div class="small" style="margin-bottom:6px"><b>Fill ONLY ONE way:</b><br><b>Way 1 (best)</b> — Cash and Online are both known: fill the first two boxes and leave the LAST box empty.<br><b>Way 2</b> — Only the day total is known: leave Cash/Online empty and fill ONLY the last box.</div><label>Cash Sale (₹) — Way 1</label><input type="number" id="nsCash" inputmode="decimal"><label>Online Sale (₹) — Way 1</label><input type="number" id="nsOnline" inputmode="decimal"><label>OR Only Total (₹) — Way 2, when the Cash/Online split is not known</label><input type="number" id="nsTotal" inputmode="decimal"><button class="btn" onclick="addSale()">+ Save Sale</button></div>'}
function nextSaleId(){let mx=0;db.sales.forEach(s=>{const m=/^S(\d{1,4})$/.exec(s.id||'');if(m)mx=Math.max(mx,+m[1])});return 'S'+String(mx+1).padStart(3,'0')}
function addSale(){const d=$('#nsDate').value;if(!d){msg('Date bharna zaroori hai — pehle date chuno.');return}const c=$('#nsCash').value,o=$('#nsOnline').value,t=$('#nsTotal').value;if(!c&&!o&&!t){msg('Cash, Online ya Total — kam se kam ek amount bharo. Khaali record save nahi hoga.');return}if((db.closedDays||[]).includes(d)){msg('Is date par stall CLOSED tha — sale save nahi hua.');return}if(db.sales.find(s=>s.date===d)){msg('Is date ka sale pehle se list me hai — naya mat banao, upar wale record ko Edit karo.');return}const s={id:nextSaleId(),date:d};if(t&&!c&&!o){s.amount=+t;s.cash=null;s.online=null}else{s.cash=+c||0;s.online=+o||0;s.amount=null}db.sales.push(s);save();render();msg('Saved — '+dstr(d)+' sale '+inr(s.amount!=null?s.amount:s.cash+s.online)+' list me jud gaya.')}
function editSale(id){const s=db.sales.find(x=>x.id===id);if(!s)return;openEdit(s.id+' - Food Sale','<label>Date - blank = Pending</label><input type="date" id="esDate" value="'+(s.date||'')+'"><label>Total Sale (Rs) - use this OR the split below</label><input type="number" id="esTotal" inputmode="decimal" value="'+(s.amount==null?'':s.amount)+'"><label>Cash Sale (Rs)</label><input type="number" id="esCash" inputmode="decimal" value="'+(s.cash==null?'':s.cash)+'"><label>Online Sale (Rs)</label><input type="number" id="esOnline" inputmode="decimal" value="'+(s.online==null?'':s.online)+'"><div class="small">If Cash/Online are filled, the split is used and Total is ignored. Leave a field blank to keep its current value.</div>',function(){const d=$('#esDate').value,t=$('#esTotal').value,c=$('#esCash').value,on=$('#esOnline').value;s.date=d===''?null:d;if(c!==''||on!==''){s.cash=+c||0;s.online=+on||0;s.amount=null}else if(t!==''){s.amount=+t;s.cash=null;s.online=null}msg('Saved - '+s.id)})}
function vClosing(){
 const rows=db.items.map(it=>{const o=db.opening.find(x=>x.itemRef===it.ref);if(!o)return'';const c=db.closing[it.ref];const calc=closingCalc(it,o,c);
 return '<div class="row"><div><b>'+esc(it.name)+'</b><div class="small">Opening: '+esc(o.text)+(o.value!=null?' · '+inr(o.value):' · value Pending')+'</div><div class="small">'+calc+'</div></div><div class="r"><input style="width:96px" type="number" inputmode="decimal" placeholder="Count" value="'+(c==null?'':c)+'" onchange="setClosing('+it.ref+',this.value)"><div class="tiny">'+esc(it.unit)+' — count in this unit</div></div></div>'}).join('');
 return '<div class="card"><h3>Month-End Closing Stock — November 2026</h3><div class="small">Enter here the stock physically counted in the shop at the END of the month. After that:<br><b>Stock Used Cost = Opening Value + Stock Purchases − Closing Value</b> (at the weighted-average rate).<br>The count has not been done yet, so the final Stock Used Cost and Profit are <b>Pending</b>. No quantity has been guessed.</div></div><div class="card">'+rows+'</div><div class="card"><div class="small">Leave an item blank if it was not counted — it will stay Pending, not become zero. If a count looks wrong, you can change it back; the old record stays in the backup/export.</div></div>'}

function closingCalc(it,o,c){if(c==null)return '<span class="pill p-pend">Count Pending</span>';if(o.value==null||o.qtyBase==null)return '<span class="pill p-pend">Value Pending — confirm the opening rate/qty</span>';const linked=db.entries.filter(e=>e.itemRef===it.ref&&e.qtyBase!=null);const aq=o.qtyBase+linked.reduce((t,e)=>t+e.qtyBase,0);const av=o.value+linked.reduce((t,e)=>t+e.amount,0);if(c>aq)return '<span class="pill p-exp">Count is more than available — fix the missing purchase/opening first</span>';const wavg=av/aq;const cv=c*wavg;const used=av-cv;return 'Weighted avg '+inr(Math.round(wavg*100)/100)+'/'+it.unit+' · Closing value <b>'+inr(Math.round(cv*100)/100)+'</b> · Used cost <b>'+inr(Math.round(used*100)/100)+'</b>'+(linked.length?'':' <span class="tiny">(based on opening only — this item’s purchases are not mapped yet)</span>')}
