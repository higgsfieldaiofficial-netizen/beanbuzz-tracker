<title>Bean Buzz — Business Management</title>
<style>
:root{--bg:#F7F1E2;--card:#FFFDF6;--green:#0C3B2E;--green2:#14532D;--gold:#C2A059;--ink:#22271F;--mut:#6B7263;--red:#B3372F;--amber:#9A6B00;--line:#E4DCC4}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:86px}
header{background:linear-gradient(135deg,var(--green),var(--green2));color:#FFF7E0;padding:14px 16px 12px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.18)}
header .t{font-family:Georgia,serif;font-size:21px;font-weight:700;letter-spacing:.4px}
header .s{font-size:12px;opacity:.85}
main{max-width:760px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin:0 0 11px;box-shadow:0 1px 3px rgba(60,50,10,.05)}
.card h3{margin:0 0 8px;font-family:Georgia,serif;color:var(--green);font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.stat .k{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.stat .v{font-size:19px;font-weight:700;margin-top:2px}
.stat .n{font-size:11.5px;color:var(--mut);margin-top:1px}
.hero{background:linear-gradient(135deg,var(--green),#1B6A45);color:#FFF7E0;border:none}
.hero .k{color:#D9C98F}.hero .v{font-size:24px}.hero .n{color:#E8E0C4}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;vertical-align:middle}
.p-pend{background:#FBEBC0;color:var(--amber)}.p-conf{background:#DDF0DD;color:#226622}.p-prov{background:#E7E4F5;color:#4A3F8F}.p-exp{background:#FBE3E0;color:var(--red)}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:none}.row .r{text-align:right;white-space:nowrap}
.small{font-size:12px;color:var(--mut)}.tiny{font-size:11px;color:var(--mut)}
button{font:inherit;cursor:pointer}
.btn{background:var(--green);color:#FFF7E0;border:none;border-radius:10px;padding:9px 14px;font-weight:600}
.btn.gold{background:var(--gold);color:#2A2110}.btn.ghost{background:#fff;border:1px solid var(--green);color:var(--green)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;font:inherit;margin:3px 0 9px}
label{font-size:12.5px;font-weight:600;color:var(--green)}
nav{position:fixed;left:0;right:0;bottom:0;background:#FFFDF6;border-top:1px solid var(--line);display:flex;z-index:6}
nav button{flex:1;background:none;border:none;padding:8px 2px 10px;font-size:11px;color:var(--mut);font-weight:600}
nav button.on{color:var(--green)}nav button .ic{display:block;font-size:19px}
.sheet{position:fixed;inset:0;background:rgba(20,25,15,.45);display:none;z-index:9}
.sheet.open{display:block}
.sheet .box{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:18px 18px 0 0;padding:16px;max-height:82vh;overflow:auto}
.sheet .box button.m{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px;margin:0 0 9px;font-weight:600;color:var(--green)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}td.r,th.r{text-align:right}
.search{margin-bottom:10px}
#lock{position:fixed;inset:0;background:var(--green);color:#FFF7E0;z-index:20;display:none;padding:40px 24px;text-align:center}
a{color:var(--green2)}
</style></head><body>

function vSales(){
 let rows=db.sales.map(s=>'<div class="row"><div><b>'+s.id+'</b> — '+(s.date?dstr(s.date):'<span class="pill p-pend">Date Pending</span>')+'<div class="small">'+(s.date?('Cash '+inr(s.cash||0)+' · Online '+inr(s.online||0)):'Cash/Online split bhi Pending — saara Cash guess nahi kiya')+'</div></div><div class="r"><b>'+inr(s.amount!=null?s.amount:(+s.cash||0)+(+s.online||0))+'</b><br><button class="btn sm ghost" onclick="editSale(\''+s.id+'\')">Edit</button></div></div>').join('');
 return '<div class="card"><h3>Food Sales — November 2026</h3><div class="small">4 sale amounts source se mile hain, kul <b>'+inr(salesTotal())+'</b> — lekin dates overwritten hain, isliye date Pending rakhi hai. Ye <b>poore mahine ki sale nahi</b> hai. Band din confirm hone par hi ₹0 hoga; khali din = Pending, band nahi.</div></div><div class="card">'+rows+'</div><div class="card"><h3>Nayi Sale Daalo</h3><label>Tarik</label><input type="date" id="nsDate"><label>Cash Sale (₹)</label><input type="number" id="nsCash" inputmode="decimal"><label>Online Sale (₹)</label><input type="number" id="nsOnline" inputmode="decimal"><label>Ya sirf Total (split pata nahi)</label><input type="number" id="nsTotal" inputmode="decimal"><button class="btn" onclick="addSale()">+ Sale Save Karo</button></div>'}
function addSale(){const d=$('#nsDate').value;if(!d){alert('Date chahiye.');return}const c=$('#nsCash').value,o=$('#nsOnline').value,t=$('#nsTotal').value;const s={id:'S'+Date.now(),date:d};if(t&&!c&&!o){s.amount=+t;s.cash=null;s.online=null}else{s.cash=+c||0;s.online=+o||0;s.amount=null}db.sales.push(s);save();render()}
function editSale(id){const s=db.sales.find(x=>x.id===id);const d=prompt('Date (YYYY-MM-DD). Khali = Pending:',s.date||'');if(d===null)return;s.date=d===''?null:d;save();render()}
function vClosing(){
 const rows=db.items.map(it=>{const o=db.opening.find(x=>x.itemRef===it.ref);if(!o)return'';const c=db.closing[it.ref];const calc=closingCalc(it,o,c);
 return '<div class="row"><div><b>'+esc(it.name)+'</b><div class="small">Opening: '+esc(o.text)+(o.value!=null?' · '+inr(o.value):' · value Pending')+'</div><div class="small">'+calc+'</div></div><div class="r"><input style="width:96px" type="number" inputmode="decimal" placeholder="Count" value="'+(c==null?'':c)+'" onchange="setClosing('+it.ref+',this.value)"><div class="tiny">'+esc(it.unit)+' me ginna</div></div></div>'}).join('');
 return '<div class="card"><h3>Month-End Closing Stock — November 2026</h3><div class="small">Mahine ke AAKHIR me dukaan me jo stock physically gina jayega, woh yahan bharo. Uske baad:<br><b>Stock Used Cost = Opening Value + Stock Purchases − Closing Value</b> (weighted-average rate par).<br>Abhi count nahi hua hai, isliye final Stock Used Cost aur Profit <b>Pending</b> hai. Guess quantity nahi bhari gayi.</div></div><div class="card">'+rows+'</div><div class="card"><div class="small">Jo item gina hi nahi, use khali chhodo — woh Pending rahega, zero nahi banega. Count galat lage to wapas badal sakte ho; purana record backup/export me rehta hai.</div></div>'}
function setClosing(ref,v){if(!db.closing)db.closing={};if(v==='')delete db.closing[ref];else db.closing[ref]=+v;save();render()}
function closingCalc(it,o,c){if(c==null)return '<span class="pill p-pend">Count Pending</span>';if(o.value==null||o.qtyBase==null)return '<span class="pill p-pend">Value Pending — opening rate/qty confirm karo</span>';const linked=db.entries.filter(e=>e.itemRef===it.ref&&e.qtyBase!=null);const aq=o.qtyBase+linked.reduce((t,e)=>t+e.qtyBase,0);const av=o.value+linked.reduce((t,e)=>t+e.amount,0);if(c>aq)return '<span class="pill p-exp">Count available se zyada hai — pehle missing purchase/opening theek karo</span>';const wavg=av/aq;const cv=c*wavg;const used=av-cv;return 'Weighted avg '+inr(Math.round(wavg*100)/100)+'/'+it.unit+' · Closing value <b>'+inr(Math.round(cv*100)/100)+'</b> · Used cost <b>'+inr(Math.round(used*100)/100)+'</b>'+(linked.length?'':' <span class="tiny">(sirf opening par hisab — is item ki purchases abhi map nahi hui)</span>')}
function vMoney(){
 const tr=db.transfers||[];
 return '<div class="card"><h3>Shop Ka Paisa — Current Snapshot</h3><div class="row"><div>Cash</div><div class="r"><b>'+inr(db.money.cash)+'</b></div></div><div class="row"><div>Online</div><div class="r"><b>'+inr(db.money.online)+'</b></div></div><div class="row"><div><b>Available Shop Money</b></div><div class="r"><b>'+inr(db.money.cash+db.money.online)+'</b></div></div><div class="small">Ye owner ka diya CURRENT snapshot hai. Ye 1 Nov ka opening balance, sale ya profit NAHI hai. Purani purchases isme se dobara nahi katengi. Ledger se reconcile abhi <b>Pending</b> hai kyunki snapshot ka exact cut-off aur 1 Nov ka opening paisa confirm nahi hai.</div></div><div class="card"><h3>Savings</h3><div class="small">Supplied savings amount: '+(db.savingsSupplied==null?'<span class="pill p-pend">Pending</span>':'<b>'+inr(db.savingsSupplied)+'</b>')+'<br>Savings transfer profit ya kharcha NAHI hota — sirf paisa ek jagah se dusri jagah jata hai, kul paisa wahi rehta hai.</div>'+tr.map(t=>'<div class="row"><div>'+esc(t.note)+'<div class="small">'+dstr(t.date)+'</div></div><div class="r"><b>'+inr(t.amount)+'</b></div></div>').join('')+'<label>Amount (₹)</label><input type="number" id="trAmt" inputmode="decimal"><label>Note</label><input id="trNote" placeholder="Cash se Savings / Savings se Cash"><button class="btn" onclick="addTransfer()">Transfer Note Karo</button></div><div class="card"><h3>Receivable / Payable</h3><div class="small">Owner ke hisab se abhi lena-dena baaki: <b>₹0 / ₹0</b> (koi udhaar outstanding nahi bataya gaya). Purchases ka paid status Pending hai — use payable nahi maana gaya jab tak confirm na ho.</div></div>'}
function addTransfer(){const a=+$('#trAmt').value;if(!a){alert('Amount chahiye');return}(db.transfers=db.transfers||[]).push({date:new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'}),amount:a,note:$('#trNote').value||'Transfer'});save();render()}
function vReports(){
 const ok=openingKnown();const rev=salesTotal();const exp=sum(entries().filter(e=>e.type==='expense'));const pu=sum(entries().filter(e=>e.type!=='expense'));
 return '<div class="card"><h3>Profit / Loss — November 2026</h3><div class="row"><div>Food Sales (available records)</div><div class="r"><b>'+inr(rev)+'</b></div></div><div class="row"><div>Opening Stock Value (known)</div><div class="r">'+inr(ok.v)+' <span class="tiny">('+ok.p+' pending)</span></div></div><div class="row"><div>Purchases (provisional kul)</div><div class="r">'+inr(pu)+'</div></div><div class="row"><div>Closing Stock Value</div><div class="r"><span class="pill p-pend">Pending — count nahi hua</span></div></div><div class="row"><div>Stock Used Cost</div><div class="r"><span class="pill p-pend">Pending</span></div></div><div class="row"><div>Transport / Rapido Expense</div><div class="r">'+inr(exp)+'</div></div><div class="row"><div>Owner Labour Allowance (Nov)</div><div class="r">'+inr(db.settings.salary)+' <span class="tiny">(allocation, cash paid nahi)</span></div></div><div class="row"><div><b>Final Profit (labour se pehle / baad)</b></div><div class="r"><span class="pill p-pend">Pending</span></div></div><div class="small">Final profit tabhi bane ga jab: (1) sales ki dates confirm hon, (2) purchases stock/expense me classify hon, (3) month-end closing count aaye. Purchases ko profit me dobara nahi kata jayega — sirf Stock Used Cost katega.</div></div><div class="card"><h3>Gas — sirf estimate</h3><div class="small">₹3,100/cylinder × lagbhag 2 = ₹6,200 mahine ka <b>estimate</b> hai. Ye November ka confirmed kharcha NAHI banaya gaya. Asli refill date/payment milega tab entry hogi.</div></div><div class="card"><h3>Din ke hisab se Purchases</h3>'+[...new Set(entries().map(e=>e.date))].sort().map(d=>'<div class="row"><div>'+dstr(d)+'</div><div class="r"><b>'+inr(sum(entries().filter(e=>e.date===d)))+'</b></div></div>').join('')+'</div>'}
function vRates(){
 return '<div class="card"><h3>Item Rates — Search</h3><input class="search" id="rateSearch" placeholder="Item dhundho: Milk, Momo, Mayo..."><div class="small">Ye <b>reference rates</b> hain (owner ke diye hue) — purani purchases in se overwrite nahi hoti. Per-unit rate tabhi dikhta hai jab pack size pakka ho, warna Pending.</div></div><div class="card" id="rateList">'+rateRows('')+'</div>'}
function rateRows(q){return db.items.filter(it=>it.name.toLowerCase().includes(q.toLowerCase())).map(it=>{const pu=perUnit(it);const buys=db.entries.filter(e=>e.raw.toLowerCase().includes(it.name.split(' ')[0].toLowerCase())&&e.amount);return '<div class="row"><div><b>'+esc(it.name)+'</b><div class="small">'+esc(it.packText)+(it.note?' · '+esc(it.note):'')+'</div></div><div class="r">'+(it.refPrice!=null?'<b>'+inr(it.refPrice)+'</b>':'<span class="pill p-pend">Rate Pending</span>')+'<div class="small">'+(pu!=null?inr(Math.round(pu*10000)/10000)+' / '+it.unit:'per-unit Pending')+'</div></div></div>'}).join('')||'<div class="small">Kuch nahi mila.</div>'}
function bindSearch(){const i=$('#rateSearch');if(i)i.oninput=()=>{$('#rateList').innerHTML=rateRows(i.value)}}
function vMenu(){return '<div class="card"><h3>Menu — Selling Prices</h3><div class="small">Ye <b>bechne ke daam</b> hain, kharid ke nahi. Packing charge ₹5 extra (per order hai ya per box — confirm pending). Daam badalne se purani sale nahi badlegi.</div></div><div class="card"><table><tr><th>Item</th><th class="r">Price</th></tr>'+db.menu.map(m=>'<tr><td>'+esc(m[1])+'<div class="tiny">'+esc(m[0])+(m[3]?' · '+esc(m[3]):'')+'</div></td><td class="r"><b>'+inr(m[2])+'</b></td></tr>').join('')+'</table><div class="small">Kul 26 variants.</div></div>'}
function vPending(){return '<div class="card"><h3>Pending Details — jo confirm karna baaki hai</h3><div class="small">Ye cheezein guess karke nahi bhari gayi. Owner jab confirm karega, wahi item Edit karke theek ho jayegi — baaki kaam rukega nahi.</div></div>'+db.pending.map(p=>'<div class="card"><h3 style="font-size:14.5px">'+esc(p[0])+'</h3><div class="small">'+esc(p[1])+'</div></div>').join('')}
function vSettings(){
 return '<div class="card"><h3>Settings</h3><label>Owner Labour Allowance — dono milakar (₹/mahina)</label><input type="number" id="setSal" value="'+db.settings.salary+'"><button class="btn" onclick="db.settings.salary=+document.querySelector(\'#setSal\').value||30000;save();alert(\'Save ho gaya\')">Save</button></div><div class="card"><h3>Backup / Export</h3><div class="small">Purane app ka pura data pehle se backup me safe hai (backup-20261112). Yahan se is app ka backup bhi le sakte ho.</div><br><button class="btn gold" onclick="exportJSON()">Backup (JSON) Download</button> <button class="btn ghost" onclick="exportCSV()">Purchases CSV</button><br><br><label>Restore (JSON file)</label><input type="file" id="restoreFile" accept=".json"><button class="btn ghost" onclick="restore()">Restore Karo</button></div><div class="card"><h3>PIN</h3><div class="small">PIN lagane ke liye Settings me 4-digit PIN daalo. Abhi '+(db.settings.pin?'PIN ON hai':'PIN OFF hai')+'.</div><label>Naya PIN (khali = PIN hatana)</label><input type="password" id="setPin" inputmode="numeric" maxlength="6"><button class="btn" onclick="setPinFn()">PIN Save</button></div>'}
function setPinFn(){const v=$('#setPin').value;db.settings.pin=v?btoa(v):null;save();alert('Ho gaya — app dobara kholne par PIN lagega.');render()}
function tryPin(){if(btoa($('#pinIn').value)===db.settings.pin){$('#lock').style.display='none'}else{$('#pinErr').textContent='Galat PIN'}}
function exportJSON(){const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='bean-buzz-backup.json';a.click()}
function exportCSV(){let csv='ID,Date,Item,Amount,Type,Note\n'+entries().map(e=>[e.id,e.date,'"'+e.raw.replace(/"/g,'""')+'"',e.amount,e.type,'"'+(e.qtyNote||'').replace(/"/g,'""')+'"'].join(',')).join('\n');const b=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='bean-buzz-purchases.csv';a.click()}
function restore(){const f=$('#restoreFile').files[0];if(!f){alert('File chuno');return}const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.seedVer!==SEED.seedVer)throw 0;db=d;save();render();alert('Restore ho gaya')}catch(e){alert('Ye file is app ki backup nahi lagti')}};r.readAsText(f)}
load();renderNav();render();
if(db.settings.pin){$('#lock').style.display='block'}
</script></body></html>
